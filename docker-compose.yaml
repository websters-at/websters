services:
  websters:
    container_name: websters
    build:
      context: .
      target: production
    restart: unless-stopped
    pull_policy: build
    mem_limit: 1g
    ports:
      - '127.0.0.1:42069:80'
    volumes: []
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
    # Container healthcheck: lightweight framework readiness probe (checks app boot;
    # use /up instead of / so asset slowness can't flap blue-green swaps)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - traefik
    labels: &websters-labels
      - "traefik.enable=true"
      # --- Router (main domain) ---
      - "traefik.http.routers.${ROUTER_NAME}.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME}.entrypoints=https"
      - "traefik.http.routers.${ROUTER_NAME}.tls=true"
      - "traefik.http.routers.${ROUTER_NAME}.tls.certresolver=letsencrypt"
      # --- Router (static assets: long-lived immutable cache) ---
      # Dedicated router so Cache-Control only applies to /assets/ and /build/.
      # Higher priority wins over the catch-all router for these paths.
      - "traefik.http.routers.${ROUTER_NAME}-static.rule=Host(`${DOMAIN}`) && (PathPrefix(`/assets/`) || PathPrefix(`/build/`) || PathPrefix(`/cookie-consent/`))"
      - "traefik.http.routers.${ROUTER_NAME}-static.entrypoints=https"
      - "traefik.http.routers.${ROUTER_NAME}-static.tls=true"
      - "traefik.http.routers.${ROUTER_NAME}-static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_NAME}-static.priority=1000"
      - "traefik.http.routers.${ROUTER_NAME}-static.middlewares=security-headers@docker,static-cache@docker"
      - "traefik.http.routers.${ROUTER_NAME}-static.service=${ROUTER_NAME}"
      - "traefik.http.middlewares.static-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable"
      # --- Router (www -> redirect to main) ---
      - "traefik.http.routers.${ROUTER_NAME}-secondary.rule=Host(`${SECONDARY_DOMAIN}`)"
      - "traefik.http.routers.${ROUTER_NAME}-secondary.entrypoints=https"
      - "traefik.http.routers.${ROUTER_NAME}-secondary.tls=true"
      - "traefik.http.routers.${ROUTER_NAME}-secondary.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${ROUTER_NAME}-secondary.middlewares=redirect-to-main"
      # --- Middleware: www -> apex ---
      - "traefik.http.middlewares.redirect-to-main.redirectregex.regex=^https?://${SECONDARY_DOMAIN}/(.*)"
      - "traefik.http.middlewares.redirect-to-main.redirectregex.replacement=https://${DOMAIN}/$$1"
      - "traefik.http.middlewares.redirect-to-main.redirectregex.permanent=true"
      # --- Security headers ---
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.X-Frame-Options=DENY"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.X-XSS-Protection=1; mode=block"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Permissions-Policy=geolocation=(), microphone=(), camera=()"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.security-headers.headers.customresponseheaders.Cross-Origin-Resource-Policy=same-origin"
      - "traefik.http.middlewares.security-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsincludesubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stspreload=true"
      # Apply security headers to all responses
      - "traefik.http.routers.${ROUTER_NAME}.middlewares=security-headers@docker"
      # --- Service: traefik routes only to containers whose docker healthcheck passed ---
      - "traefik.http.services.${ROUTER_NAME}.loadbalancer.server.port=80"

  # Blue-green twin: shares the same traefik router labels as `websters`, so
  # traefik load-balances across both and only sends traffic to healthy
  # containers. deploy.sh builds/starts the idle twin, waits for its
  # healthcheck, then stops the other one -> zero downtime deploys.
  # `profiles: [green]` prevents `docker compose up -d` (without --profile) from
  # starting both containers at once and causing every-other-request 404s when
  # the two images contain different hashed asset filenames.
  websters2:
    profiles: ["green"]
    container_name: websters2
    build:
      context: .
      target: production
    restart: unless-stopped
    pull_policy: build
    volumes: []
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - traefik
    labels: *websters-labels

  mysql:
    ports:
      - "10.8.1.1:3307:3306"
    container_name: mysql
    image: 'mysql:9'
    restart: unless-stopped
    mem_limit: 1g
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      # Bind mount so data lives on the host (easy backups / inspectable)
      - './mysql/data:/var/lib/mysql'
    # Port intentionally NOT published: MySQL stays internal to the Docker
    # network and is only reachable by the websters container.
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - traefik

  redis:
    ports:
      - "10.8.1.1:6380:6379"
    container_name: redis
    image: 'redis:7-alpine'
    restart: unless-stopped
    mem_limit: 256m
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - './redis/data:/data'
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
